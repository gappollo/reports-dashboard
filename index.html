<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Rassegna Stampa</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --yellow: #FDC400; --yellow-dark: #E6B000; --yellow-pale: #FFF8E0; --yellow-bg: #FFFBEB;
    --black: #1A1A1A; --black-mid: #21272A;
    --purple: #5B52CF; --purple-bg: #F0EFFE;
    --blue-link: #0072F0; --blue-bg: #EBF4FF;
    --green: #7ED321; --green-dark: #4A7A00; --green-bg: #F0F8E6;
    --red: #E03E3E; --red-bg: #FFF0F0;
    --white: #FFFFFF; --bg: #F2F4F8; --bg-soft: #F8F9FB;
    --border: #DDE1E6; --border-mid: #C1C7CD;
    --text: #1A1A1A; --text-mid: #3D3D3D; --text-soft: #697077;
    --safe-top: env(safe-area-inset-top,0px); --safe-bottom: env(safe-area-inset-bottom,0px);
    --safe-left: env(safe-area-inset-left,0px); --safe-right: env(safe-area-inset-right,0px);
    --radius: 14px; --radius-sm: 8px;
    --shadow: 0 2px 12px rgba(0,0,0,0.07); --shadow-md: 0 4px 24px rgba(0,0,0,0.10);
  }
  html { height: -webkit-fill-available; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh; min-height: -webkit-fill-available;
    font-size: 14px; line-height: 1.5;
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
    padding-bottom: calc(64px + var(--safe-bottom));
  }

  /* ── TOPBAR ── */
  .topbar {
    background: var(--black); height: 56px;
    padding: 0 20px; padding-left: calc(20px + var(--safe-left)); padding-right: calc(20px + var(--safe-right));
    display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 200;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .tb-logo { display: flex; align-items: center; gap: 10px; }
  .fw-mark {
    width: 34px; height: 34px; background: var(--yellow); border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 900; color: var(--black);
    letter-spacing: -1px; font-style: italic; flex-shrink: 0;
  }
  .tb-name { color: #fff; font-size: 15px; font-weight: 700; }
  .tb-sub { color: rgba(255,255,255,0.5); font-size: 11px; }
  .tb-back {
    color: var(--yellow); font-size: 13px; font-weight: 600;
    text-decoration: none; display: flex; align-items: center; gap: 4px;
  }

  /* ── SCROLL ── */
  .scroll { overflow-y: auto; padding: 16px; max-width: 700px; margin: 0 auto; }

  /* ── TAB BAR ── */
  .tabbar {
    background: var(--white); border-bottom: 1px solid var(--border);
    display: flex; overflow-x: auto; padding: 0 16px;
    -webkit-overflow-scrolling: touch; position: sticky; top: 56px; z-index: 100;
  }
  .tabbar::-webkit-scrollbar { display: none; }
  .tab {
    flex-shrink: 0; padding: 13px 16px 11px;
    font-size: 13px; font-weight: 600; color: var(--text-soft);
    cursor: pointer; border: none; background: none;
    border-bottom: 3px solid transparent; transition: all 0.15s; white-space: nowrap;
  }
  .tab.active { color: var(--black); border-bottom-color: var(--yellow); }
  .tab-count {
    display: inline-block; background: var(--bg); color: var(--text-soft);
    font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 10px; margin-left: 5px;
  }
  .tab.active .tab-count { background: var(--yellow-pale); color: var(--black); }

  /* ── PANEL ── */
  .panel { display: none; }
  .panel.active { display: block; }

  /* ── SEC LABEL ── */
  .sec-label {
    font-size: 11px; font-weight: 800; text-transform: uppercase;
    letter-spacing: 0.9px; color: var(--text-soft);
    margin: 20px 0 10px; padding: 0 2px;
    display: flex; align-items: center; gap: 6px;
  }
  .sec-label::before {
    content: ''; display: inline-block; width: 3px; height: 14px;
    background: var(--yellow); border-radius: 2px;
  }
  .sec-label:first-child { margin-top: 0; }

  /* ── CARD ── */
  .card {
    background: var(--white); border-radius: var(--radius);
    box-shadow: var(--shadow); margin-bottom: 12px;
    border: 1px solid var(--border); overflow: hidden;
  }
  .card-head {
    padding: 14px 16px 12px; border-bottom: 1px solid var(--border);
    display: flex; align-items: flex-start; gap: 12px;
  }
  .cicon {
    width: 38px; height: 38px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 17px; flex-shrink: 0;
  }
  .ci-y { background: var(--yellow-pale); }
  .ci-b { background: var(--blue-bg); }
  .ci-p { background: var(--purple-bg); }
  .ci-g { background: var(--green-bg); }
  .card-meta { flex: 1; min-width: 0; }
  .card-title { font-size: 14px; font-weight: 700; color: var(--text); line-height: 1.3; }
  .card-date { font-size: 11px; color: var(--text-soft); margin-top: 2px; }
  .card-tag {
    font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 20px; flex-shrink: 0; align-self: flex-start;
  }
  .tag-morning { background: var(--yellow-pale); color: #8A6500; }
  .tag-competitor { background: var(--blue-bg); color: #004999; }
  .tag-weekly { background: var(--purple-bg); color: #3B33A0; }
  .card-body { padding: 14px 16px; }

  /* ── BRIEF ITEM ── */
  .brief-item {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 9px 0; border-bottom: 1px solid var(--border);
    font-size: 13px; line-height: 1.5;
  }
  .brief-item:last-child { border-bottom: none; padding-bottom: 0; }
  .brief-item:first-child { padding-top: 0; }
  .brief-emoji { font-size: 16px; flex-shrink: 0; margin-top: 1px; }
  .brief-text { flex: 1; }
  .brief-text strong { font-weight: 700; color: var(--text); }
  .brief-text .source { font-size: 11px; color: var(--blue-link); margin-top: 2px; display: block; }

  /* ── COMPETITOR ITEM ── */
  .comp-item { padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .comp-item:last-child { border-bottom: none; }
  .comp-item:first-child { padding-top: 0; }
  .comp-header { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .comp-name { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-soft); }
  .comp-badge { font-size: 10px; font-weight: 600; padding: 1px 7px; border-radius: 10px; }
  .badge-new { background: var(--green-bg); color: #2D6A00; }
  .badge-partner { background: var(--blue-bg); color: #004999; }
  .badge-product { background: var(--purple-bg); color: #3B33A0; }
  .comp-title { font-weight: 600; color: var(--text); line-height: 1.3; }
  .comp-summary { color: var(--text-mid); margin-top: 3px; font-size: 12px; line-height: 1.4; }
  .comp-link { font-size: 11px; color: var(--blue-link); margin-top: 4px; display: block; }

  /* ── INSIGHT ITEM ── */
  .insight-item { padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .insight-item:last-child { border-bottom: none; }
  .insight-num {
    display: inline-flex; align-items: center; justify-content: center;
    width: 22px; height: 22px; background: var(--yellow); color: var(--black);
    border-radius: 50%; font-size: 11px; font-weight: 800; flex-shrink: 0;
  }
  .insight-row { display: flex; align-items: flex-start; gap: 10px; }
  .insight-title { font-weight: 700; color: var(--text); margin-bottom: 3px; }
  .insight-body { color: var(--text-mid); font-size: 12px; line-height: 1.4; }
  .insight-impl {
    margin-top: 6px; padding: 7px 10px;
    background: var(--yellow-bg); border-left: 3px solid var(--yellow);
    border-radius: 0 6px 6px 0; font-size: 11px; color: var(--text-mid); line-height: 1.4;
  }

  /* ── EMPTY STATE ── */
  .empty { text-align: center; padding: 48px 20px; color: var(--text-soft); }
  .empty-icon { font-size: 40px; margin-bottom: 12px; }
  .empty-title { font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
  .empty-sub { font-size: 13px; }

  /* ── LAST UPDATE ── */
  .last-update { font-size: 11px; color: var(--text-soft); text-align: center; padding: 16px 0 8px; }

  /* ── LIVE DOT ── */
  .live-dot {
    display: inline-block; width: 7px; height: 7px;
    background: var(--green); border-radius: 50%; margin-right: 5px;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; } 50% { opacity: 0.3; }
  }

  /* ── BOTTOM NAV ── */
  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    height: calc(60px + var(--safe-bottom));
    background: var(--black); border-top: 1px solid rgba(255,255,255,0.1);
    display: flex; align-items: flex-start; justify-content: space-around;
    padding-top: 8px; padding-bottom: var(--safe-bottom);
    padding-left: var(--safe-left); padding-right: var(--safe-right);
    box-shadow: 0 -4px 20px rgba(0,0,0,0.25);
  }
  .bn-item {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    text-decoration: none; color: rgba(255,255,255,0.45);
    font-size: 10px; font-weight: 600; letter-spacing: 0.2px;
    min-width: 56px; text-align: center; position: relative; padding-top: 2px;
    transition: color 0.15s;
  }
  .bn-item.active { color: var(--yellow); }
  .bn-pip {
    position: absolute; top: -8px; left: 50%; transform: translateX(-50%);
    width: 20px; height: 3px; border-radius: 0 0 3px 3px;
    background: var(--yellow); opacity: 0; transition: opacity 0.15s;
  }
  .bn-item.active .bn-pip { opacity: 1; }
  .bn-icon { font-size: 20px; font-weight: 300; }
  .bn-label { font-size: 10px; }

  @media (min-width: 640px) { .bottom-nav { display: none; } }
</style>
</head>
<body>

<!-- PASSWORD OVERLAY -->
<div id="pw-overlay" style="position:fixed;inset:0;z-index:9999;background:var(--black);display:flex;align-items:center;justify-content:center;padding:24px;">
  <div style="background:var(--bg);border-radius:20px;padding:32px 24px;width:100%;max-width:360px;text-align:center;">
    <div style="font-size:32px;margin-bottom:12px;">🔒</div>
    <div style="font-size:18px;font-weight:700;margin-bottom:6px;">Rassegna Stampa</div>
    <div style="font-size:13px;color:var(--text-soft);margin-bottom:24px;">Accesso riservato</div>
    <div style="position:relative;margin-bottom:12px;">
      <input id="pw-input" type="password" placeholder="Password" autocomplete="current-password"
        style="width:100%;padding:13px 44px 13px 16px;border-radius:10px;border:1.5px solid var(--border);font-size:15px;background:var(--white);color:var(--text);outline:none;">
      <button id="pw-eye" style="position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:18px;color:var(--text-soft);">👁</button>
    </div>
    <div id="pw-error" style="color:#E03E3E;font-size:12px;min-height:18px;margin-bottom:10px;"></div>
    <button id="pw-submit" style="width:100%;padding:14px;border-radius:10px;background:var(--yellow);border:none;font-size:15px;font-weight:700;color:var(--black);cursor:pointer;">Entra</button>
  </div>
</div>

<!-- TOPBAR -->
<div class="topbar">
  <div class="tb-logo">
    <div class="fw-mark">f</div>
    <div>
      <div class="tb-name">Rassegna Stampa</div>
      <div class="tb-sub"><span class="live-dot"></span>Market Intelligence</div>
    </div>
  </div>
  <a href="index.html" class="tb-back">&#8592; Dashboard</a>
</div>

<!-- TAB BAR -->
<div class="tabbar">
  <button class="tab active" onclick="showTab('morning',this)">🌅 Mattutino <span class="tab-count" id="cnt-morning">0</span></button>
  <button class="tab" onclick="showTab('competitor',this)">🏢 Competitor <span class="tab-count" id="cnt-competitor">0</span></button>
  <button class="tab" onclick="showTab('weekly',this)">📊 Prospettiva <span class="tab-count" id="cnt-weekly">0</span></button>
</div>

<div class="scroll">

<!-- PANEL MATTUTINO -->
<div id="panel-morning" class="panel active">
  <div id="morning-content"></div>
</div>

<!-- PANEL COMPETITOR -->
<div id="panel-competitor" class="panel">
  <div id="competitor-content"></div>
</div>

<!-- PANEL PROSPETTIVA -->
<div id="panel-weekly" class="panel">
  <div id="weekly-content"></div>
</div>

</div><!-- /scroll -->

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <a class="bn-item active" href="index.html">
    <div class="bn-pip"></div>
    <span class="bn-icon">&#128240;</span>
    <span class="bn-label">Rassegna</span>
  </a>
  <a class="bn-item" href="documenti.html">
    <div class="bn-pip"></div>
    <span class="bn-icon">&#128196;</span>
    <span class="bn-label">Docs</span>
  </a>
  <a class="bn-item" href="home.html">
    <div class="bn-pip"></div>
    <span class="bn-icon">&#127968;</span>
    <span class="bn-label">Home</span>
  </a>
</nav>

<script>
// ── AUTH (same hash as main dashboard) ──
(function(){
  const HASH = '10b72f4e9794044c9b56d6bd6bf3659acea17fd3583c85f6ff9d7b7262ef2e0f';
  const SESSION_KEY = 'fw_auth';
  const overlay = document.getElementById('pw-overlay');
  const input = document.getElementById('pw-input');
  const btn = document.getElementById('pw-submit');
  const errorEl = document.getElementById('pw-error');
  const eyeBtn = document.getElementById('pw-eye');
  if (sessionStorage.getItem(SESSION_KEY) === '1') { overlay.style.display='none'; return; }
  async function sha256(msg) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(msg));
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }
  async function tryLogin() {
    const val = input.value;
    if (!val) { errorEl.textContent='Inserisci la password.'; return; }
    const h = await sha256(val);
    if (h === HASH) {
      sessionStorage.setItem(SESSION_KEY,'1');
      overlay.style.display='none';
      loadData();
    } else {
      errorEl.textContent='Password errata. Riprova.';
      input.value='';
    }
  }
  btn.addEventListener('click', tryLogin);
  input.addEventListener('keydown', e => { if(e.key==='Enter') tryLogin(); });
  eyeBtn.addEventListener('click', () => { input.type = input.type==='password'?'text':'password'; });
  input.focus();
  if (sessionStorage.getItem(SESSION_KEY) === '1') loadData();
})();

// ── TABS ──
function showTab(name, el) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('panel-' + name).classList.add('active');
  el.classList.add('active');
}

// ── LOAD DATA ──
function loadData() {
  loadJSON('data/morning.json', renderMorning, 'morning-content', 'cnt-morning');
  loadJSON('data/competitor.json', renderCompetitor, 'competitor-content', 'cnt-competitor');
  loadJSON('data/weekly.json', renderWeekly, 'weekly-content', 'cnt-weekly');
}

function loadJSON(url, renderer, containerId, countId) {
  fetch(url + '?t=' + Date.now())
    .then(r => { if(!r.ok) throw new Error('not found'); return r.json(); })
    .then(data => {
      document.getElementById(containerId).innerHTML = renderer(data);
      document.getElementById(countId).textContent = data.items ? data.items.length : 0;
    })
    .catch(() => {
      document.getElementById(containerId).innerHTML = emptyState();
    });
}

function emptyState() {
  return '<div class="empty"><div class="empty-icon">📭</div><div class="empty-title">Nessun aggiornamento</div><div class="empty-sub">Il prossimo briefing arriverà domani mattina alle 07:30</div></div>';
}

function escHtml(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── RENDERERS ──
function renderMorning(data) {
  if (!data.items || !data.items.length) return emptyState();
  let html = '<div class="sec-label">' + escHtml(data.date) + ' · ore 07:30</div>';
  html += '<div class="card">';
  html += '<div class="card-head"><div class="cicon ci-y">🌅</div>';
  html += '<div class="card-meta"><div class="card-title">Brief Mattutino — Cyber, Telco & LinkedIn</div>';
  html += '<div class="card-date">'+escHtml(data.date)+' · '+data.items.length+' segnali rilevanti</div></div>';
  html += '<span class="card-tag tag-morning">MATTUTINO</span></div>';
  html += '<div class="card-body">';
  data.items.forEach(item => {
    html += '<div class="brief-item">';
    html += '<div class="brief-emoji">'+escHtml(item.emoji||'📌')+'</div>';
    html += '<div class="brief-text"><strong>'+escHtml(item.title)+'</strong> — '+escHtml(item.body);
    if (item.source) html += '<span class="source">→ '+escHtml(item.source)+'</span>';
    html += '</div></div>';
  });
  html += '</div></div>';
  html += '<div class="last-update">Prossimo aggiornamento domani alle 07:30</div>';
  return html;
}

function renderCompetitor(data) {
  if (!data.items || !data.items.length) return emptyState();
  let html = '<div class="sec-label">'+escHtml(data.period)+'</div>';
  html += '<div class="card">';
  html += '<div class="card-head"><div class="cicon ci-b">🏢</div>';
  html += '<div class="card-meta"><div class="card-title">Monitor Competitor</div>';
  html += '<div class="card-date">'+data.items.length+' aggiornamenti</div></div>';
  html += '<span class="card-tag tag-competitor">COMPETITOR</span></div>';
  html += '<div class="card-body">';
  data.items.forEach(item => {
    const badgeClass = item.badge_type==='new'?'badge-new':item.badge_type==='partner'?'badge-partner':'badge-product';
    html += '<div class="comp-item">';
    html += '<div class="comp-header"><span class="comp-name">'+escHtml(item.company)+'</span>';
    if(item.badge) html += '<span class="comp-badge '+badgeClass+'">'+escHtml(item.badge)+'</span>';
    html += '</div>';
    html += '<div class="comp-title">'+escHtml(item.title)+'</div>';
    html += '<div class="comp-summary">'+escHtml(item.summary)+'</div>';
    if(item.link) html += '<a class="comp-link" href="'+escHtml(item.link)+'" target="_blank">→ '+escHtml(item.source||item.link)+'</a>';
    html += '</div>';
  });
  html += '</div></div>';
  html += '<div class="last-update">Prossimo aggiornamento martedì alle 10:00</div>';
  return html;
}

function renderWeekly(data) {
  if (!data.insights || !data.insights.length) return emptyState();
  let html = '<div class="sec-label">Prospettiva settimanale · '+escHtml(data.date)+'</div>';
  html += '<div class="card">';
  html += '<div class="card-head"><div class="cicon ci-p">📊</div>';
  html += '<div class="card-meta"><div class="card-title">Le 3 mosse più significative</div>';
  html += '<div class="card-date">+ Cosa tenere d\'occhio la prossima settimana</div></div>';
  html += '<span class="card-tag tag-weekly">PROSPETTIVA</span></div>';
  html += '<div class="card-body">';
  data.insights.forEach((item, i) => {
    html += '<div class="insight-item"><div class="insight-row">';
    html += '<span class="insight-num">'+(i+1)+'</span><div>';
    html += '<div class="insight-title">'+escHtml(item.title)+'</div>';
    html += '<div class="insight-body">'+escHtml(item.body)+'</div>';
    if(item.implication) html += '<div class="insight-impl">&#128161; <strong>Implicazione:</strong> '+escHtml(item.implication)+'</div>';
    html += '</div></div></div>';
  });
  html += '</div></div>';
  if (data.watchlist && data.watchlist.length) {
    html += '<div class="card">';
    html += '<div class="card-head"><div class="cicon ci-g">🔭</div>';
    html += '<div class="card-meta"><div class="card-title">Prossima settimana — tieni d\'occhio</div>';
    html += '<div class="card-date">'+escHtml(data.next_week||'')+'</div></div></div>';
    html += '<div class="card-body">';
    data.watchlist.forEach(item => {
      html += '<div class="brief-item"><div class="brief-emoji">'+escHtml(item.emoji||'📅')+'</div>';
      html += '<div class="brief-text"><strong>'+escHtml(item.title)+'</strong> — '+escHtml(item.body)+'</div></div>';
    });
    html += '</div></div>';
  }
  html += '<div class="last-update">Prossimo aggiornamento venerdì alle 10:00</div>';
  return html;
}

// Auto-load if already authenticated
if (sessionStorage.getItem('fw_auth') === '1') loadData();
</script>
</body>
</html>
